<header class="welcome-hero" id="welcome-hero">

    <div class="hero-cloud" style="top:4%; width:340px; height:80px; animation-duration:75s; animation-delay:0s;"></div>
    <div class="hero-cloud" style="top:11%; width:220px; height:56px; animation-duration:58s; animation-delay:-20s;"></div>
    <div class="hero-cloud" style="top:2%; width:180px; height:46px; animation-duration:66s; animation-delay:-42s;"></div>
  </div>
  <div class="crt-scene" id="crt-scene">
    <div class="crt-wrap">
      <img class="crt-monitor-img" src="assets/img/hero/ibook.webp" alt="">
      <div class="crt-screen">
        <div class="welcome-3d-wrap" id="welcome-3d-wrap" role="img" aria-label="Welcome to Yifan Lyu's Portfolio"></div>
      </div>
      <div class="hero-bubble-slider">
        <span>&#129767;</span>
        <input type="range" id="bubble-density" min="0" max="100" step="5" value="75">
        <span class="bubble-pct" id="bubble-pct">75%</span>
      </div>
    </div>
    <div class="scatter-windows" id="scatter-windows"></div>
  </div>

  <div class="welcome-actions">
    <a href="#cat-tiles" class="btn-solid">
      <span data-i18n="hero_cta">查看作品</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a href="about.html" class="btn-line" data-i18n="intro_more">完整履历</a>

<div class="confirm-modal" id="photo-confirm-modal" aria-hidden="true">
  <div class="confirm-backdrop" data-confirm-close></div>
  <div class="confirm-card win">
    <div class="win-titlebar">
      <span class="win-icon"></span>
      <span class="win-title" data-i18n="photo_confirm_title">跳转提示</span>
      <div class="win-controls"><span data-confirm-close>x</span></div>
    </div>
    <div class="win-body confirm-body">
      <p data-i18n="photo_confirm_body">即将离开本站，前往一个独立的摄影作品网站。</p>
      <div class="confirm-actions">
        <button type="button" class="btn-line" data-confirm-close data-i18n="photo_confirm_cancel">取消</button>
        <button type="button" class="btn-solid" id="photo-confirm-ok" data-i18n="photo_confirm_ok">继续前往</button>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js?v=62"></script>

<script src="js/gallery.js?v=62"></script>
<script src="js/home.js?v=62"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  function applyInlineLang() {
    const lang = document.documentElement.getAttribute("data-lang") || "en";
    document.querySelectorAll("[data-lang-zh]").forEach((el) => {
      el.textContent = lang === "zh" ? el.dataset.langZh : el.dataset.langEn;
    });
  }
  document.addEventListener("DOMContentLoaded", applyInlineLang);
  document.addEventListener("langchange", applyInlineLang);
</script>
</body>
